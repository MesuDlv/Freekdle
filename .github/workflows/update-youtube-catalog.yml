name: Actualizar catálogo de REFDLE (YouTube)

on:
  schedule:
    - cron: '0 6 * * *'   # todos los días a las 6:00 UTC (~1:00 am Colombia)
  workflow_dispatch: {}    # botón "Run workflow" manual en GitHub

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generar catálogo desde la YouTube Data API v3
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-youtube-catalog.js

      - name: Commitear si hay cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/youtube-catalog.json
          git diff --cached --quiet || git commit -m "Actualizar catálogo de REFDLE (YouTube)"
          git push
